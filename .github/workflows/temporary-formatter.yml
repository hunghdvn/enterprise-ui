name: Temporary formatter

on:
  push:
    branches:
      - feat/balanced-sky-design-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format showcase
        run: pnpm exec prettier --write apps/playground/src/App.tsx apps/playground/src/style.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/playground/src/App.tsx apps/playground/src/style.css
          git commit -m "style: format Balanced Sky showcase"
          git push
