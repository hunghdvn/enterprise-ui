name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - run: npm --workspaces run typecheck --if-present
      - run: npm run docs:snippets
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build --workspace=@enterprise-ui/components
      - run: npm run build --workspace=@enterprise-ui/showcase
      - run: npm run build --workspace=@enterprise-ui/docs
      - uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish: npm run release
          version: npm run version:packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
